services:
  api:
    build:
      context: ./case-study-builder
      dockerfile: Dockerfile.preview.api
    environment:
      PORT: 4000
      DB_PATH: /app/data/csb.db

  web:
    image: node:20-bookworm
    working_dir: /app/apps/web
    environment:
      API_PROXY_TARGET: http://api:4000
    volumes:
      - ./case-study-builder:/app
    depends_on:
      - api
    ports:
      - "3000:3000"
    command: ["node", "/app/node_modules/.bin/next", "start", "-p", "3000", "-H", "0.0.0.0"]